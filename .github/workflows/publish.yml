name: Publish

# Publishes to npm, then lists that version in the official MCP registry, when a
# version tag (v1.2.3) is pushed. Run it by hand from the Actions tab to
# rehearse: a manual run only does a dry run and never publishes.
#
# Auth: once a trusted publisher is set up for this repo and workflow on
# npmjs.com, npm authenticates through OIDC and no token is needed. Until then,
# an NPM_TOKEN secret (granular token with publish rights) is used if present.
# The registry login uses GitHub OIDC: the name io.github.izzet/mcp is proven by
# this repository, so it needs no secret.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate

      - name: Check the tag matches package.json and server.json, and is on main
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          node -e '
            const pkg = require("./package.json")
            const server = require("./server.json")
            const same =
              server.name === pkg.mcpName &&
              server.version === pkg.version &&
              server.packages[0].version === pkg.version
            if (!same) {
              console.error("server.json does not match package.json (name or version)")
              process.exit(1)
            }
          '
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          fi
          npm publish --access public --provenance $DRY_RUN

      - name: Wait for the version to appear on npm
        if: github.ref_type == 'tag'
        run: |
          # npm takes a couple of minutes to serve a new version, and the registry
          # checks the published package (its mcpName) before it lists the server.
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            name="$(npm view "iyildirim@$version" mcpName 2>/dev/null || true)"
            if [ "$name" = "io.github.izzet/mcp" ]; then exit 0; fi
            echo "iyildirim@$version not on npm yet (attempt $i)"
            sleep 20
          done
          echo "iyildirim@$version did not appear on npm in time" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate registry metadata
        if: github.event_name == 'workflow_dispatch'
        run: ./mcp-publisher validate

      - name: Publish to the MCP registry
        if: github.ref_type == 'tag'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
